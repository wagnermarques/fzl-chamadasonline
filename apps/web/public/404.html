<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chamada Online</title>
    <script>
      // GitHub Pages has no server-side rewrite for client-side routes, so a
      // hard refresh on e.g. /admin/events/x/display 404s here instead of
      // reaching index.html. This re-encodes the path into a query string and
      // redirects to the app root, where the inline script in index.html
      // decodes it back before React Router mounts. Standard workaround:
      // https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // "/fzl-chamadasonline/" has one path segment
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
